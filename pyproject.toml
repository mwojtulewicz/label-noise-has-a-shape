[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "label-noise-has-a-shape"
version = "0.1.0"
description = "Geometry-guided exact-budget label-noise benchmark generation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [
  {name = "Mateusz Wojtulewicz"},
  {name = "Piotr Duda"},
  {name = "Leszek Rutkowski"},
]
dependencies = [
  "numpy==2.4.1",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.urls]
Repository = "https://github.com/mwojtulewicz/label-noise-has-a-shape"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
